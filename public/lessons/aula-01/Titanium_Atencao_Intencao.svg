<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <rect width="1800" height="920" fill="#090B0D"/>
  <text x="85" y="90" fill="#C8A467" font-family="Arial, sans-serif" font-size="28" font-weight="700">AULA 01 · ESTADO DA PESSOA</text>
  <text x="85" y="155" fill="#F5F3EF" font-family="Arial, sans-serif" font-size="54" font-weight="700">Atenção e intenção não são a mesma coisa.</text>
  <text x="85" y="210" fill="#85898B" font-family="Arial, sans-serif" font-size="24">A mensagem pode encontrar alguém distraído ou alguém que já está procurando uma solução.</text>

  <g font-family="Arial, sans-serif">
    <rect x="85" y="315" width="760" height="430" rx="28" fill="#15191D" stroke="#2B3136" stroke-width="3"/>
    <text x="130" y="370" fill="#C8A467" font-size="24" font-weight="700">ATENÇÃO</text>
    <text x="130" y="425" fill="#F5F3EF" font-size="38" font-weight="700">A mensagem encontra a pessoa.</text>
    <text x="130" y="480" fill="#C8C5BE" font-size="23">Ela não estava necessariamente procurando.</text>
    <text x="130" y="520" fill="#C8C5BE" font-size="23">Primeiro, algo precisa ser percebido.</text>
    <rect x="130" y="585" width="610" height="90" rx="14" fill="#20262B"/>
    <text x="160" y="623" fill="#85898B" font-size="18">EXEMPLO</text>
    <text x="160" y="655" fill="#F5F3EF" font-size="21">Pessoa navegando e percebe uma mensagem relevante.</text>

    <rect x="955" y="315" width="760" height="430" rx="28" fill="#15191D" stroke="#C8A467" stroke-width="4"/>
    <text x="1000" y="370" fill="#C8A467" font-size="24" font-weight="700">INTENÇÃO</text>
    <text x="1000" y="425" fill="#F5F3EF" font-size="38" font-weight="700">A pessoa já procura uma solução.</text>
    <text x="1000" y="480" fill="#C8C5BE" font-size="23">Existe necessidade, curiosidade ou busca ativa.</text>
    <text x="1000" y="520" fill="#C8C5BE" font-size="23">A mensagem encontra um interesse mais explícito.</text>
    <rect x="1000" y="585" width="610" height="90" rx="14" fill="#20262B"/>
    <text x="1030" y="623" fill="#85898B" font-size="18">EXEMPLO</text>
    <text x="1030" y="655" fill="#F5F3EF" font-size="21">Pessoa procurando atendimento para um problema específico.</text>

    <rect x="85" y="790" width="1630" height="70" rx="14" fill="#20262B" stroke="#2B3136"/>
    <text x="120" y="834" fill="#F5F3EF" font-size="22">O estado da pessoa muda a forma como a comunicação pode ser construída.</text>
  </g>
</svg>
