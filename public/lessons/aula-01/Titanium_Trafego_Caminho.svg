<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <rect width="1800" height="920" fill="#090B0D"/>
  <text x="85" y="90" fill="#C8A467" font-family="Arial, sans-serif" font-size="28" font-weight="700">AULA 01 · O CAMINHO BÁSICO</text>
  <text x="85" y="155" fill="#F5F3EF" font-family="Arial, sans-serif" font-size="54" font-weight="700">Tráfego cria movimento. O resultado acontece depois.</text>
  <text x="85" y="210" fill="#85898B" font-family="Arial, sans-serif" font-size="24">A pessoa percorre etapas. Cada passagem pode funcionar ou quebrar.</text>

  <g font-family="Arial, sans-serif">
    <rect x="85" y="350" width="230" height="210" rx="20" fill="#15191D" stroke="#2B3136" stroke-width="3"/>
    <text x="115" y="398" fill="#C8A467" font-size="20" font-weight="700">01</text>
    <text x="115" y="448" fill="#F5F3EF" font-size="30" font-weight="700">PESSOA</text>
    <text x="115" y="492" fill="#C8C5BE" font-size="20">tem um contexto,</text>
    <text x="115" y="522" fill="#C8C5BE" font-size="20">interesse ou necessidade</text>

    <rect x="375" y="350" width="230" height="210" rx="20" fill="#15191D" stroke="#2B3136" stroke-width="3"/>
    <text x="405" y="398" fill="#C8A467" font-size="20" font-weight="700">02</text>
    <text x="405" y="448" fill="#F5F3EF" font-size="30" font-weight="700">MENSAGEM</text>
    <text x="405" y="492" fill="#C8C5BE" font-size="20">cria atenção ou</text>
    <text x="405" y="522" fill="#C8C5BE" font-size="20">encontra intenção</text>

    <rect x="665" y="350" width="230" height="210" rx="20" fill="#15191D" stroke="#C8A467" stroke-width="4"/>
    <text x="695" y="398" fill="#C8A467" font-size="20" font-weight="700">03</text>
    <text x="695" y="448" fill="#F5F3EF" font-size="30" font-weight="700">CLIQUE</text>
    <text x="695" y="492" fill="#C8C5BE" font-size="20">faz a pessoa</text>
    <text x="695" y="522" fill="#C8C5BE" font-size="20">avançar</text>

    <rect x="955" y="350" width="230" height="210" rx="20" fill="#15191D" stroke="#2B3136" stroke-width="3"/>
    <text x="985" y="398" fill="#C8A467" font-size="20" font-weight="700">04</text>
    <text x="985" y="448" fill="#F5F3EF" font-size="30" font-weight="700">DESTINO</text>
    <text x="985" y="492" fill="#C8C5BE" font-size="20">página, site, conversa</text>
    <text x="985" y="522" fill="#C8C5BE" font-size="20">ou aplicativo</text>

    <rect x="1245" y="350" width="230" height="210" rx="20" fill="#15191D" stroke="#2B3136" stroke-width="3"/>
    <text x="1275" y="398" fill="#C8A467" font-size="20" font-weight="700">05</text>
    <text x="1275" y="448" fill="#F5F3EF" font-size="30" font-weight="700">AÇÃO</text>
    <text x="1275" y="492" fill="#C8C5BE" font-size="20">a pessoa realiza</text>
    <text x="1275" y="522" fill="#C8C5BE" font-size="20">o próximo passo</text>

    <rect x="1535" y="350" width="180" height="210" rx="20" fill="#20262B" stroke="#C8A467" stroke-width="4"/>
    <text x="1565" y="398" fill="#C8A467" font-size="20" font-weight="700">06</text>
    <text x="1565" y="448" fill="#F5F3EF" font-size="28" font-weight="700">RESULTADO</text>
    <text x="1565" y="492" fill="#C8C5BE" font-size="18">valor para</text>
    <text x="1565" y="520" fill="#C8C5BE" font-size="18">o negócio</text>

    <g stroke="#C8A467" stroke-width="5" fill="#C8A467">
      <line x1="320" y1="455" x2="360" y2="455"/><polygon points="360,455 345,446 345,464"/>
      <line x1="610" y1="455" x2="650" y2="455"/><polygon points="650,455 635,446 635,464"/>
      <line x1="900" y1="455" x2="940" y2="455"/><polygon points="940,455 925,446 925,464"/>
      <line x1="1190" y1="455" x2="1230" y2="455"/><polygon points="1230,455 1215,446 1215,464"/>
      <line x1="1480" y1="455" x2="1520" y2="455"/><polygon points="1520,455 1505,446 1505,464"/>
    </g>

    <rect x="85" y="660" width="1630" height="145" rx="18" fill="#15191D" stroke="#C8A467" stroke-width="2"/>
    <text x="120" y="704" fill="#C8A467" font-size="21" font-weight="700">PONTO-CHAVE</text>
    <text x="120" y="750" fill="#F5F3EF" font-size="26" font-weight="700">Tráfego pago atua principalmente no movimento até o destino.</text>
    <text x="120" y="786" fill="#C8C5BE" font-size="21">Aquisição depende do caminho completo até um resultado útil.</text>
  </g>
</svg>
